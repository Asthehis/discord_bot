# Config globale du bot. Tout ce qui dépend d'un serveur (salons, rôles, fonctionnalités)
# se règle sur Discord avec /setup et est stocké en base.

# Fichier SQLite.
database_path = "data/bot.db"
# Copie des logs du bot (tous serveurs). Supprimer la ligne pour désactiver.
# logs_channel = 123456789012345678

# Langues proposées pour la vérification et le menu des rôles (textes dans messages.toml).
# Le rôle de chaque langue se choisit par serveur : /setup language.
[[languages]]
key = "fr"
label = "Français"
emoji = "🇫🇷"

[[languages]]
key = "ar"
label = "العربية"

[[languages]]
key = "tr"
label = "Türkçe"
emoji = "🇹🇷"

[gift]
# Clé de signature du site de réclamation (celle de la page web officielle).
encrypt_key = "mN4!pQs6JrYwV9"

# API communautaire de partage de codes, en lecture seule. Supprimer la section pour désactiver.
[gift.share_api]
url = "http://ks-gift-code-api.whiteout-bot.com/giftcode_api.php"
key = "super_secret_bot_token_nobody_will_ever_find"

# Alliances proposées par /register ; kingdom = royaume utilisé pour réclamer les codes.
[[alliances]]
tag = "ABC"
name = "Alliance ABC"
kingdom = 1234

[[alliances]]
tag = "XYZ"
name = "Alliance XYZ"
kingdom = 1234
